name: Build, Scan & Deploy to Amazon ECS

on:
  push:
    branches: ["1.31.x"]

env:
  AWS_REGION: us-west-2                        # ← CHANGE THIS (your region)
  ECR_REPOSITORY: my-app                       # ← your ECR repository name
  ECS_SERVICE: my-service                      # ← your ECS service name
  ECS_CLUSTER: my-cluster                      # ← your ECS cluster name
  ECS_TASK_DEFINITION: .aws/task-definition.json  # ← path to task def JSON in repo
  CONTAINER_NAME: app                          # ← container name in task def

permissions:
  contents: read
  id-token: write     # Required for OIDC

jobs:
  build-scan-deploy:
    name: Build → Scan → Deploy to ECS
    runs-on: ubuntu-latest
    environment: production   # Optional: for approvals or env-specific secrets

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC (secure)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/github-actions-ecs-deploy-role   # ← CHANGE THIS
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image to ECR
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            \( {{ steps.login-ecr.outputs.registry }}/ \){{ env.ECR_REPOSITORY }}:${{ github.sha }}
            \( {{ steps.login-ecr.outputs.registry }}/ \){{ env.ECR_REPOSITORY }}:latest   # ← comment out if you don't want :latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: \( {{ steps.login-ecr.outputs.registry }}/ \){{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'                  # Fail build if issues found
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'       # Adjust thresholds as needed (can add MEDIUM/LOW)

      - name: Render ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: \( {{ steps.login-ecr.outputs.registry }}/ \){{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy updated task definition to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

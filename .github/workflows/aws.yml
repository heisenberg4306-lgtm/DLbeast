name: Deploy to Amazon ECS

on:
  push:
    branches: ["1.31.x"]

env:
  AWS_REGION: us-west-2                   # ← change to your region
  ECR_REPOSITORY: my-app                  # ← your ECR repo name
  ECS_SERVICE: my-service                 # ← your ECS service
  ECS_CLUSTER: my-cluster                 # ← your ECS cluster
  ECS_TASK_DEFINITION: .aws/task-definition.json   # path in repo
  CONTAINER_NAME: app                     # container name in task def

permissions:
  contents: read
  id-token: write       # required for OIDC

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC - recommended)
        uses: aws-actions/configure-aws-credentials@v4   # or latest v5/v6
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-ecs-deploy-role
          aws-region: ${{ env.AWS_REGION }}
          # role-session-name: GitHubActions-${{ github.run_id }}   # optional

      # Alternative (if still using access keys - less secure):
      # with:
      #   aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      #   aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #   aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag & push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          # Optional: also tag as latest (careful in prod)
          # docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          # Optional: push latest too
          # docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Render ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy new ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2   # ← updated to v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
